version: "3.8"

# =============================================================================
# WooTech CRM - Stack para Portainer (Producao)
# Dominio: crm.wootech.com.br
# =============================================================================
# Copie as variaveis de ambiente para Environment Variables da Stack no Portainer.
# Veja .env.portainer.example para a lista completa de variaveis obrigatorias.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # FRONTEND - React + Vite + Nginx
  # ---------------------------------------------------------------------------
  frontend:
    image: ghcr.io/fluowai/wootech-crm-frontend:latest
    environment:
      VITE_API_URL: "same-origin"
      VITE_LIVEKIT_URL: "${VITE_LIVEKIT_URL:-}"
      VITE_PANEL_URL: "https://crm.wootech.com.br"
      VITE_SUPABASE_URL: "${SUPABASE_URL:-}"
      VITE_SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY:-}"
    networks:
      - woopanel1
      - nexus360_internal
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=woopanel1"
        # Router principal - crm.wootech.com.br
        - "traefik.http.routers.nexus360_frontend.rule=Host(`crm.wootech.com.br`)"
        - "traefik.http.routers.nexus360_frontend.entrypoints=websecure"
        - "traefik.http.routers.nexus360_frontend.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.nexus360_frontend.tls.domains[0].main=crm.wootech.com.br"
        - "traefik.http.routers.nexus360_frontend.priority=10"
        - "traefik.http.routers.nexus360_frontend.service=nexus360_frontend"
        - "traefik.http.services.nexus360_frontend.loadbalancer.server.port=80"

  # ---------------------------------------------------------------------------
  # API - Node.js + Express + Prisma
  # ---------------------------------------------------------------------------
  api:
    image: ghcr.io/fluowai/wootech-crm-api:latest
    environment:
      NODE_ENV: "production"
      RUN_BACKGROUND_WORKERS: "true"
      PORT: "10000"
      FRONTEND_URL: "https://crm.wootech.com.br"
      CORS_ORIGINS: "https://crm.wootech.com.br,https://www.crm.wootech.com.br"

      # Banco de dados (Supabase)
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL obrigatoria}"
      DIRECT_URL: "${DIRECT_URL:?DIRECT_URL obrigatoria}"
      SUPABASE_DB_URL: "${DATABASE_URL:?DATABASE_URL obrigatoria}"
      PGSSLMODE: "require"

      # Auth
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET obrigatorio}"

      # Supabase
      SUPABASE_URL: "${SUPABASE_URL:-}"
      SUPABASE_REST_URL: "${SUPABASE_URL:-}/rest/v1"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY:-}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:-}"
      SUPABASE_JWT_SECRET: "${JWT_SECRET:?JWT_SECRET obrigatorio}"

      # WhiteLabel / Dominios
      WHITELABEL_DOCKER_IP: "${WHITELABEL_DOCKER_IP:-}"
      WHITELABEL_CNAME_TARGET: "${WHITELABEL_CNAME_TARGET:-crm.wootech.com.br}"

      # Traefik integration
      TRAEFIK_SYNC_MODE: "${TRAEFIK_SYNC_MODE:-docker-service}"
      TRAEFIK_FRONTEND_URL: "${TRAEFIK_FRONTEND_URL:-http://nexus360_frontend:80}"
      TRAEFIK_API_URL: "${TRAEFIK_API_URL:-http://nexus360_api:10000}"
      TRAEFIK_CERT_RESOLVER: "${TRAEFIK_CERT_RESOLVER:-letsencryptresolver}"
      TRAEFIK_ROUTER_SERVICE: "${TRAEFIK_ROUTER_SERVICE:-nexus360_frontend}"
      TRAEFIK_ROUTER_LABEL_PREFIX: "${TRAEFIK_ROUTER_LABEL_PREFIX:-nexus360_custom}"
      TRAEFIK_DOCKER_NETWORK: "${TRAEFIK_DOCKER_NETWORK:-woopanel1}"
      DOCKER_SOCKET_PATH: "/var/run/docker.sock"

      # AI Core (LiteLLM)
      AI_CORE_URL: "${AI_CORE_URL:-http://litellm:4000/v1}"
      AI_CORE_API_KEY: "${AI_CORE_API_KEY:-}"
      AI_CORE_DEFAULT_MODEL: "${AI_CORE_DEFAULT_MODEL:-gpt-4o-mini}"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      CHATGPT_API_KEY: "${CHATGPT_API_KEY:-${OPENAI_API_KEY:-}}"
      TOGETHER_API_KEY: "${TOGETHER_API_KEY:-}"

      # Search / Scraping APIs
      SERPER_API_KEY: "${SERPER_API_KEY:-}"
      SERPAPI_API_KEY: "${SERPAPI_API_KEY:-}"
      SERP_API_KEY: "${SERP_API_KEY:-}"
      OUTSCRAPER_API_KEY: "${OUTSCRAPER_API_KEY:-}"
      OUTSCRAPER_KEY: "${OUTSCRAPER_KEY:-}"
      MUAC_API_KEY: "${MUAC_API_KEY:-}"

      # Google Maps Scraper
      GOOGLE_MAPS_SCRAPER_URL: "http://google-maps-scraper:8080"
      GOOGLE_MAPS_SCRAPER_CONCURRENCY: "${GOOGLE_MAPS_SCRAPER_CONCURRENCY:-2}"
      GOOGLE_MAPS_SCRAPER_JOB_TIMEOUT_MS: "${GOOGLE_MAPS_SCRAPER_JOB_TIMEOUT_MS:-240000}"

      # WhatsApp Bridge
      WHATSAPP_BRIDGE_URL: "${WHATSAPP_BRIDGE_URL:-http://whatsapp-bridge:8091}"
      WHATSAPP_BRIDGE_SECRET: "${WHATSAPP_BRIDGE_SECRET:?WHATSAPP_BRIDGE_SECRET obrigatorio}"

      # LiveKit
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-}"
      LIVEKIT_URL: "${LIVEKIT_URL:-}"

      # Billing
      BILLING_WEBHOOK_SECRET: "${BILLING_WEBHOOK_SECRET:-}"
      ASAAS_WEBHOOK_SECRET: "${ASAAS_WEBHOOK_SECRET:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"

      # MinIO (Storage)
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-}"
      MINIO_PORT: "${MINIO_PORT:-443}"
      MINIO_USE_SSL: "${MINIO_USE_SSL:-true}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-}"
      MINIO_PUBLIC_URL: "${MINIO_PUBLIC_URL:-}"
      MINIO_REGION: "${MINIO_REGION:-us-east-1}"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      woopanel1:
      nexus360_internal:
        aliases:
          - backend
          - nexus360_api
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      update_config:
        order: stop-first
        failure_action: rollback
      rollback_config:
        order: stop-first
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=woopanel1"
        # Router API - crm.wootech.com.br
        - "traefik.http.routers.nexus360_api.rule=Host(`crm.wootech.com.br`) && (PathPrefix(`/api`) || PathPrefix(`/lp`))"
        - "traefik.http.routers.nexus360_api.entrypoints=websecure"
        - "traefik.http.routers.nexus360_api.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.nexus360_api.tls.domains[0].main=crm.wootech.com.br"
        - "traefik.http.routers.nexus360_api.priority=20"
        - "traefik.http.routers.nexus360_api.service=nexus360_api"
        - "traefik.http.services.nexus360_api.loadbalancer.server.port=10000"

  # ---------------------------------------------------------------------------
  # GOOGLE MAPS SCRAPER - Go + Playwright
  # ---------------------------------------------------------------------------
  google-maps-scraper:
    image: ghcr.io/fluowai/wootech-crm-google-maps-scraper:latest
    command:
      - "-web"
      - "-addr"
      - ":8080"
      - "-data-folder"
      - "/gmapsdata"
      - "-c"
      - "${GOOGLE_MAPS_SCRAPER_WORKERS:-2}"
      - "-browser-pool-size"
      - "${GOOGLE_MAPS_SCRAPER_BROWSER_POOL:-1}"
    volumes:
      - google_maps_scraper_data:/gmapsdata
    networks:
      - nexus360_internal
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 2G
    stop_grace_period: 30s

  # ---------------------------------------------------------------------------
  # WHATSAPP BRIDGE - Go
  # ---------------------------------------------------------------------------
  whatsapp-bridge:
    image: ghcr.io/fluowai/wootech-crm-whatsapp-bridge:latest
    environment:
      WHATSAPP_BRIDGE_ADDR: ":8091"
      WHATSAPP_BRIDGE_SECRET: "${WHATSAPP_BRIDGE_SECRET:?WHATSAPP_BRIDGE_SECRET obrigatorio}"
      WHATSAPP_BRIDGE_PUBLIC_URL: "${WHATSAPP_BRIDGE_PUBLIC_URL:-https://crm.wootech.com.br}"
      NEXUS_BACKEND_URL: "${NEXUS_BACKEND_URL:-http://backend:10000}"
    volumes:
      - whatsapp_bridge_data:/app/data
    networks:
      nexus360_internal:
        aliases:
          - whatsapp-bridge
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  # ---------------------------------------------------------------------------
  # LITELLM - Proxy de IA (OpenAI, Gemini, Groq)
  # ---------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    environment:
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
    configs:
      - source: litellm_config
        target: /app/config.yaml
    networks:
      nexus360_internal:
        aliases:
          - litellm
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=false"

# =============================================================================
# CONFIGS
# =============================================================================
configs:
  litellm_config:
    file: ./litellm.config.yaml

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  google_maps_scraper_data:
    name: nexus360_google_maps_scraper_data
  whatsapp_bridge_data:
    name: nexus360_whatsapp_bridge_data

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  woopanel1:
    external: true
    name: woopanel1
  nexus360_internal:
    driver: overlay
    attachable: true
