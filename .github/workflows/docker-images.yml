name: Build Docker Images

on:
  push:
    branches:
      - main
      - codex/crm-functional-fixes
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: fluowai
  API_IMAGE: wootech-crm-api
  FRONTEND_IMAGE: wootech-crm-frontend
  GOOGLE_MAPS_SCRAPER_IMAGE: wootech-crm-google-maps-scraper
  WHATSAPP_BRIDGE_IMAGE: wootech-crm-whatsapp-bridge

jobs:
  quality:
    name: Test, lint, build and audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: whatsapp-bridge/go.mod
          cache-dependency-path: whatsapp-bridge/go.sum

      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Generate Prisma client
        run: npm run prisma:generate --prefix backend

      - name: TypeScript typecheck backend
        run: npx tsc --noEmit
        working-directory: backend

      - name: TypeScript typecheck frontend
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Lint source code
        run: |
          npm run lint --prefix backend
          npm run lint --prefix frontend

      - name: Run tests
        run: |
          npm test --prefix backend
          npm test --prefix frontend
          cd whatsapp-bridge && go test ./...

      - name: Build applications
        run: |
          npm run build --prefix backend
          npm run build --prefix frontend

      - name: Audit production dependencies
        run: |
          npm audit --prefix backend --omit=dev --audit-level=critical
          npm audit --prefix frontend --omit=dev --audit-level=critical

      - name: Scan for hardcoded secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  build:
    name: Build and push GHCR images
    runs-on: ubuntu-latest
    needs: [quality, security-scan]
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.API_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.API_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=same-origin
            VITE_LIVEKIT_URL=
            VITE_PANEL_URL=https://woocrm.wootech.com.br
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Build and push Google Maps scraper
        uses: docker/build-push-action@v6
        with:
          context: ./integrations/google-maps-scraper
          file: ./integrations/google-maps-scraper/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.GOOGLE_MAPS_SCRAPER_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.GOOGLE_MAPS_SCRAPER_IMAGE }}:${{ github.sha }}

      - name: Build and push WhatsApp bridge
        uses: docker/build-push-action@v6
        with:
          context: ./whatsapp-bridge
          file: ./whatsapp-bridge/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.WHATSAPP_BRIDGE_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.WHATSAPP_BRIDGE_IMAGE }}:${{ github.sha }}
